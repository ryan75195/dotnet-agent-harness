# agent-factory repository policy. Read from the DEFAULT BRANCH only — the factory
# cannot project work items for this repo until this file is on main.
#
# Valid top-level keys (RepositoryPolicySchema.TopLevelKeys): version, enabled,
# defaultProvider, baseBranch, authorizedMaintainers, authorizedTeam,
# concurrencyLimit, priority, retry. Unknown keys are rejected.
version: 1
# Disabled deliberately. This repository's tests are PowerShell (plugin/template-tests/*-test.ps1,
# dotnet/template-tests/analyzer-drift.ps1) run under pwsh on windows-latest, and the factory's
# runner is an Alpine Linux image carrying git, curl, jq, gh, bash, coreutils, dotnet and node --
# no PowerShell. A .ps1 test command therefore exits 127 in the runner no matter what the planner
# writes, which is exactly how issue #27 failed. Two planner passes were spent before that was
# understood. Re-enable when either the runner image carries pwsh or this repository grows tests
# the runner can execute.
enabled: false
defaultProvider: opencode
baseBranch: main

# Only these accounts can authorise a run by applying factory:ready.
authorizedMaintainers:
  - ryan75195

# Deliberately lower than the factory's own 10: this repo's guardrail suite is
# duplicated across four templates, so concurrent agents are more likely to collide
# on the same files. Raise it once that stops being true.
concurrencyLimit: 3

retry:
  maxAttempts: 3
  backoffSeconds: 30
